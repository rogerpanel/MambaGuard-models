# Default training recipe.
# Corresponds to Section 6.2 of the paper ("Optimisation Protocol").

name: default

seed: 42
epochs: 30
batch_size: 256
num_workers: 8
mixed_precision: bf16   # {fp32, fp16, bf16}
grad_clip: 1.0
window_size: 128

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_steps: 500
  min_lr: 1.0e-6

# Imbalance-aware focal loss (Section 4.5)
focal_loss:
  alpha: 0.25
  gamma: 2.0

# Lipschitz regulariser used in the certification bound (Eq. 12)
lipschitz_reg:
  lambda_L: 1.0e-3
  layer_targets: ["mamba", "out_proj"]

# Logging / checkpointing
log:
  wandb_project: mambaguard
  log_grad_norm: true
checkpoint:
  save_every_epoch: true
  monitor: val/macro_f1
  mode: max
