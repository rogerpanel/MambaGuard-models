[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mambaguard"
version = "1.0.0"
description = "Certified Selective State-Space Detection for Multi-Protocol LLM Agent Security"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Roger Nick Anaedevha", email = "rnanaedevha@mephi.ru" },
    { name = "Alexander G. Trofimov" },
]
keywords = [
    "state-space-models",
    "mamba",
    "graph-neural-networks",
    "intrusion-detection",
    "llm-agent-security",
    "model-context-protocol",
    "certified-robustness",
    "stackelberg",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.3",
    "torch-geometric>=2.5",
    "mamba-ssm>=1.2",
    "causal-conv1d>=1.2",
    "einops",
    "transformers",
    "sentence-transformers",
    "datasets",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "networkx",
    "cvxpy",
    "gymnasium",
    "pyyaml",
    "hydra-core",
    "omegaconf",
    "matplotlib",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "black>=24.0", "mypy>=1.8"]
wandb = ["wandb>=0.16"]

[project.urls]
Homepage = "https://github.com/rogerpanel/MambaGuard-models"
Platform = "https://github.com/rogerpanel/robustidps.ai"
Zenodo = "https://doi.org/10.5281/zenodo.19129512"

[project.scripts]
mambaguard-train = "scripts.train:main"
mambaguard-eval = "scripts.evaluate:main"
mambaguard-certify = "scripts.certify:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "notebooks*", "benchmarks*", "configs*", "scripts*"]

# ----------------------------------------------------------------------------
# Code style
# ----------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "benchmarks/baselines"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = ["E501", "B008", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
"scripts/*" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["mambaguard"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a CUDA device",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
